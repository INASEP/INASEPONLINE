<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INASEP — Plataforma de Clases en Vivo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- SheetJS para leer/escribir Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ══════════════════════════════════════════════
   VARIABLES — PALETA INASEP
══════════════════════════════════════════════ */
:root {
  --green-900: #0d1f14;
  --green-800: #142a1b;
  --green-700: #1e3d28;
  --green-600: #2a5536;
  --green-500: #3d7a4e;
  --green-400: #4a8c5c;
  --green-300: #68a87a;
  --green-200: #9fcfab;
  --green-100: #d4edda;
  --green-50:  #f0f8f2;
  --primary:      #4a8c5c;
  --primary-dark: #3d7a4e;
  --primary-light:#68a87a;
  --accent:       #8fbc8f;
  --sidebar-bg:   #0d1f14;
  --sidebar-nav:  #142a1b;
  --sidebar-hover:#1e3d28;
  --sidebar-border: rgba(255,255,255,0.07);
  --bg:       #f4f7f5;
  --card-bg:  #ffffff;
  --text:     #1a2e1e;
  --text-mid: #4a6651;
  --text-light:#7a9880;
  --border:   #d6e8da;
  --success: #27ae60;
  --warning: #e67e22;
  --danger:  #c0392b;
  --info:    #2980b9;
  --radius:  10px;
  --radius-lg: 16px;
  --shadow:  0 2px 14px rgba(13,31,20,0.08);
  --shadow-md: 0 6px 24px rgba(13,31,20,0.13);
  --transition: 0.18s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Sora', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
.dashboard { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px;
  background: var(--sidebar-bg);
  display: flex; flex-direction: column;
  position: fixed; top:0; left:0; bottom:0;
  z-index: 200; overflow-y: auto;
  transition: transform 0.28s ease;
}
.sidebar-top {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--sidebar-border);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-top .brand { color:#fff; font-size:15px; font-weight:700; }
.sidebar-top .sub   { color: rgba(255,255,255,0.45); font-size:11px; margin-top:2px; }
.sidebar-nav { flex:1; padding: 10px 0; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 20px;
  color: rgba(255,255,255,0.65);
  text-decoration: none; font-size: 13.5px; font-weight: 500;
  transition: var(--transition); cursor: pointer;
  border-left: 3px solid transparent;
}
.sidebar-nav a:hover { background: var(--sidebar-hover); color:#fff; }
.sidebar-nav a.active {
  background: var(--sidebar-hover); color: var(--green-200);
  border-left-color: var(--green-300); font-weight: 600;
}
.sidebar-user {
  padding: 14px 20px;
  border-top: 1px solid var(--sidebar-border);
}
.sidebar-user .sb-name  { color:#fff; font-size:13px; font-weight:600; }
.sidebar-user .sb-email { color:rgba(255,255,255,0.4); font-size:11px; margin-top:2px; }
.sidebar-footer {
  padding: 12px 20px 16px;
}
.sidebar-footer button {
  background: none; border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.55); padding: 8px 14px;
  border-radius: 7px; font-size: 12.5px; cursor: pointer;
  width: 100%; font-family: inherit; transition: var(--transition);
}
.sidebar-footer button:hover { background: rgba(255,255,255,0.07); color:#fff; }
.main-wrapper { margin-left: 260px; flex:1; display:flex; flex-direction:column; }
.topbar {
  height: 60px; background:#fff; border-bottom:1px solid var(--border);
  display: flex; align-items: center; padding: 0 28px; gap: 16px;
  position: sticky; top:0; z-index:100; box-shadow: var(--shadow);
}
.topbar-title { font-size:16px; font-weight:700; color:var(--green-900); margin-right:auto; }
.topbar-user { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--text-mid); }
.avatar { width:32px; height:32px; border-radius:50%; background:var(--green-500); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
.mob-menu-btn { display:none; background:var(--sidebar-bg); border:none; color:#fff; width:38px; height:38px; border-radius:8px; font-size:18px; cursor:pointer; align-items:center; justify-content:center; }
.mob-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:150; }
.mob-overlay.active { display:block; }
.main-content { padding: 28px 32px; flex:1; }

/* ══════════════════════════════════════════════
   PAGE HEADER
══════════════════════════════════════════════ */
.page-header {
  margin-bottom: 24px; display:flex; align-items:flex-start;
  justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.page-header h2 { font-size:22px; font-weight:700; color:var(--green-900); }
.breadcrumb { font-size:12.5px; color:var(--text-light); margin-top:3px; }
.breadcrumb a { color:var(--primary); text-decoration:none; cursor:pointer; }

/* ══════════════════════════════════════════════
   CARDS
══════════════════════════════════════════════ */
.card {
  background:var(--card-bg); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px 24px;
  margin-bottom:18px; border:1px solid var(--border);
}
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
.card-header h3 { font-size:16px; font-weight:700; color:var(--green-900); }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.stat-card .stat-icon { font-size:26px; margin-bottom:8px; }
.stat-card .stat-value { font-size:26px; font-weight:700; color:var(--primary); line-height:1; }
.stat-card .stat-label { font-size:12px; color:var(--text-light); margin-top:4px; font-weight:500; text-transform:uppercase; letter-spacing:0.4px; }

/* ══════════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════════ */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 20px; border:none; border-radius:8px;
  font-size:13.5px; font-weight:600; font-family:inherit;
  cursor:pointer; transition:var(--transition);
  text-decoration:none; letter-spacing:0.2px; white-space:nowrap;
}
.btn-primary   { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-dark); box-shadow:0 4px 16px rgba(74,140,92,0.35); transform:translateY(-1px); }
.btn-secondary { background:#eef3f0; color:var(--text-mid); }
.btn-secondary:hover { background:#dde8e1; }
.btn-danger    { background:var(--danger); color:#fff; }
.btn-danger:hover { background:#a93226; }
.btn-success   { background:var(--success); color:#fff; }
.btn-success:hover { background:#219a52; }
.btn-warning   { background:var(--warning); color:#fff; }
.btn-warning:hover { background:#ca6f1e; }
.btn-info      { background:var(--info); color:#fff; }
.btn-info:hover { background:#1f6ea3; }
.btn-sm { padding:6px 13px; font-size:12px; border-radius:6px; }
.btn:disabled { opacity:0.55; cursor:not-allowed; transform:none !important; }
.btn-live { background: linear-gradient(135deg, #c0392b, #e74c3c); color:#fff; animation: livePulse 2s ease-in-out infinite; }
@keyframes livePulse { 0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.4)} 50%{box-shadow:0 0 0 8px rgba(192,57,43,0)} }

/* ══════════════════════════════════════════════
   TABLE
══════════════════════════════════════════════ */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { padding:11px 14px; text-align:left; border-bottom:1px solid #eef2ef; }
th { background:var(--green-50); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-mid); }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#f9fcfa; }

/* ══════════════════════════════════════════════
   BADGE
══════════════════════════════════════════════ */
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.badge-green  { background:#e6f9ee; color:#1a7a3a; }
.badge-gray   { background:#f0f0f0; color:#666; }
.badge-blue   { background:#e6f0ff; color:#1a56db; }
.badge-orange { background:#fef3e6; color:#b45309; }
.badge-red    { background:#fde8e8; color:#a93226; }
.badge-live   { background:#fde8e8; color:#c0392b; animation: blinkBadge 1.5s ease infinite; }
@keyframes blinkBadge { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ══════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════ */
.modal-overlay { position:fixed; inset:0; background:rgba(13,31,20,0.65); z-index:999; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
.modal { background:#fff; border-radius:var(--radius-lg); padding:28px 30px; width:100%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,0.3); }
.modal h3 { margin-bottom:18px; font-size:18px; font-weight:700; color:var(--green-900); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
.modal-wide { max-width:950px; }

/* ══════════════════════════════════════════════
   FORM
══════════════════════════════════════════════ */
.form-group { margin-bottom:15px; }
.form-group label { display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-mid); margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:11px 13px; border:2px solid var(--border);
  border-radius:8px; font-size:14px; font-family:inherit;
  background:#fafcfb; color:var(--text); transition:var(--transition); resize:vertical;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline:none; border-color:var(--primary); background:#fff;
  box-shadow:0 0 0 3px rgba(74,140,92,0.12);
}
.form-group small { display:block; margin-top:5px; font-size:12px; color:var(--text-light); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* ══════════════════════════════════════════════
   CLASE EN VIVO — CARD
══════════════════════════════════════════════ */
.live-class-card { background:#fff; border-radius:var(--radius-lg); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow); transition:var(--transition); margin-bottom:16px; }
.live-class-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
.live-class-header { background:linear-gradient(135deg,var(--green-900) 0%,var(--green-700) 100%); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
.live-class-header h4 { color:#fff; font-size:15px; font-weight:700; }
.live-class-body { padding:18px 20px; }
.live-class-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--text-mid); margin-bottom:14px; }
.live-class-meta span { display:flex; align-items:center; gap:5px; }
.live-class-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* ══════════════════════════════════════════════
   VIDEO PLAYER — MEET LAUNCH PANEL
   Google Meet no permite embeds (X-Frame-Options SAMEORIGIN)
   Se usa un panel de lanzamiento con botón directo
══════════════════════════════════════════════ */
.video-room { background:#0d1f14; border-radius:var(--radius-lg); overflow:hidden; position:relative; min-height:340px; display:flex; align-items:center; justify-content:center; }
.video-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; color:rgba(255,255,255,0.6); gap:12px; padding:40px; text-align:center; }
.video-placeholder .icon { font-size:60px; opacity:0.4; }
iframe.video-frame { width:100%; height:100%; min-height:500px; border:none; }

/* Panel Meet nativo (reemplaza iframe) */
.meet-launch-panel {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px; padding:40px 24px; text-align:center; width:100%;
  background: linear-gradient(135deg, #0d1f14 0%, #1e3d28 60%, #0d1f14 100%);
  min-height:340px;
}
.meet-launch-panel .meet-icon { font-size:56px; margin-bottom:4px; }
.meet-launch-panel h3 { color:#fff; font-size:20px; font-weight:700; margin:0; }
.meet-launch-panel p  { color:rgba(255,255,255,0.55); font-size:13px; max-width:420px; line-height:1.6; margin:0; }
.meet-launch-btn {
  display:inline-flex; align-items:center; gap:10px;
  background: linear-gradient(135deg, #1a73e8, #1557b0);
  color:#fff; border:none; border-radius:12px;
  padding:16px 36px; font-size:16px; font-weight:700;
  cursor:pointer; font-family:inherit; text-decoration:none;
  box-shadow: 0 4px 20px rgba(26,115,232,0.5);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.meet-launch-btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(26,115,232,0.6); color:#fff; }
.meet-presence-badge {
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; padding:8px 16px; color:rgba(255,255,255,0.7); font-size:12.5px;
  display:flex; align-items:center; gap:8px;
}
.meet-presence-badge .dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:blinkBadge 2s infinite; flex-shrink:0; }

/* ══════════════════════════════════════════════
   ASISTENCIA — CHECKBOX GRANDE
══════════════════════════════════════════════ */
.attendance-check-box {
  border:2px solid var(--border); border-radius:var(--radius-lg);
  padding:24px; text-align:center; margin-bottom:20px;
  background: linear-gradient(135deg, #f0f8f2, #fff);
}
.attendance-check-box.checked {
  border-color: var(--success);
  background: linear-gradient(135deg, #eafaf1, #f5fdf7);
}
.check-label { font-size:16px; font-weight:700; color:var(--green-900); margin-bottom:16px; display:block; }
.check-wrapper { display:flex; align-items:center; justify-content:center; gap:16px; }
.big-check {
  width:56px; height:56px; border:3px solid var(--border);
  border-radius:12px; cursor:pointer; appearance:none; -webkit-appearance:none;
  background:#fff; transition:all 0.2s ease; position:relative; flex-shrink:0;
}
.big-check:checked {
  background: var(--success); border-color: var(--success);
}
.big-check:checked::after {
  content:'✓'; position:absolute; top:50%; left:50%;
  transform:translate(-50%,-55%); color:#fff; font-size:30px; font-weight:700;
}
.big-check:hover:not(:checked) { border-color:var(--primary); background:var(--green-50); }
.check-text { font-size:15px; color:var(--text-mid); font-weight:500; text-align:left; }
.check-text strong { display:block; color:var(--green-900); font-size:16px; }
.attendance-time-stamp { font-size:12px; color:var(--text-light); margin-top:8px; font-family:'DM Mono',monospace; }

/* Tabla de asistencia diaria */
.att-table-wrap { overflow-x:auto; }
.att-table { width:100%; border-collapse:collapse; font-size:13px; min-width:500px; }
.att-table th { background:var(--green-50); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-mid); padding:9px 12px; white-space:nowrap; }
.att-table td { padding:9px 12px; border-bottom:1px solid #eef2ef; vertical-align:middle; }
.att-table tr:last-child td { border-bottom:none; }
.att-table tr:hover td { background:#f9fcfa; }
.att-dot-ok  { display:inline-block; width:18px; height:18px; border-radius:4px; background:var(--success); text-align:center; line-height:18px; font-size:11px; color:#fff; }
.att-dot-no  { display:inline-block; width:18px; height:18px; border-radius:4px; background:#e0e0e0; }
.att-pct { font-weight:700; font-size:13px; }
.att-pct.good    { color:var(--success); }
.att-pct.warning { color:var(--warning); }
.att-pct.danger  { color:var(--danger);  }

/* Online indicator */
.online-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--success); animation:blinkBadge 2s ease infinite; margin-right:4px; }
.offline-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ccc; margin-right:4px; }

/* ══════════════════════════════════════════════
   HORARIO
══════════════════════════════════════════════ */
.schedule-grid { display:grid; gap:8px; }
.schedule-row { display:grid; grid-template-columns:80px 1fr; align-items:center; gap:12px; padding:10px 14px; background:#fff; border:1px solid var(--border); border-radius:8px; }
.schedule-time { font-family:'DM Mono',monospace; font-size:13px; font-weight:600; color:var(--primary); }
.schedule-subject { font-size:14px; font-weight:500; color:var(--text); }
.schedule-day { font-size:12px; color:var(--text-light); margin-top:2px; }

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
.toast-container { position:fixed; top:16px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; max-width:360px; }
.toast { background:#fff; border-radius:10px; padding:13px 16px; box-shadow:0 4px 20px rgba(0,0,0,0.15); display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:500; border-left:4px solid var(--primary); animation:slideInRight 0.25s ease; }
.toast.success { border-color:var(--success); }
.toast.error   { border-color:var(--danger); }
.toast.warning { border-color:var(--warning); }
@keyframes slideInRight { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }

/* ══════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════ */
.auth-wrap {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px 16px; background:var(--green-900);
  background-image: radial-gradient(ellipse at 20% 50%, rgba(74,140,92,0.18) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(143,188,143,0.10) 0%, transparent 50%);
}
.auth-card { background:#fff; border-radius:var(--radius-lg); padding:40px 36px 36px; width:100%; max-width:430px; box-shadow:0 24px 64px rgba(0,0,0,0.35); }
.auth-logo { text-align:center; margin-bottom:28px; }
.auth-logo .brand-name { font-size:32px; font-weight:800; color:var(--green-400); letter-spacing:2px; }
.auth-logo .brand-sub { font-size:12px; color:var(--text-light); text-transform:uppercase; letter-spacing:1px; margin-top:4px; }
.auth-card h2 { font-size:19px; font-weight:700; color:var(--green-900); margin-bottom:22px; text-align:center; }
.alert { padding:11px 15px; border-radius:8px; font-size:13px; font-weight:500; display:none; margin-bottom:16px; border-left:4px solid; }
.alert-error   { background:#fdecea; color:#9b2335; border-color:#e74c3c; }
.alert-success { background:#eafaf1; color:#1e7e34; border-color:#27ae60; }

/* ══════════════════════════════════════════════
   UTILIDADES
══════════════════════════════════════════════ */
.hidden { display:none !important; }
.flex { display:flex; }
.items-center { align-items:center; }
.justify-between { justify-content:space-between; }
.gap-2 { gap:8px; }
.gap-3 { gap:12px; }
.mt-1 { margin-top:6px; }
.mt-2 { margin-top:14px; }
.mb-2 { margin-bottom:14px; }
.text-right { text-align:right; }
.text-center { text-align:center; }
.empty-state { text-align:center; padding:50px 20px; color:var(--text-light); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

/* Upload zone */
.upload-zone {
  border:2px dashed var(--border); border-radius:12px;
  padding:32px; text-align:center; cursor:pointer;
  transition:var(--transition); background:#fafcfb;
}
.upload-zone:hover, .upload-zone.dragging { border-color:var(--primary); background:var(--green-50); }
.upload-zone .icon { font-size:40px; margin-bottom:10px; }
.upload-zone p { font-size:14px; color:var(--text-mid); }
.upload-zone small { font-size:12px; color:var(--text-light); }

/* Progress bar */
.progress-bar-wrap { background:#e8f5e9; border-radius:8px; padding:4px; margin-bottom:6px; }
.progress-bar { background:var(--primary); height:8px; border-radius:8px; width:0%; transition:width 0.3s; }

/* ══════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════ */
@media (max-width: 768px) {

<script>
/* ════════════════════════════════════════════════
   FIREBASE CONFIG
════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDcnKLmmWiXEAfisLihhCf17hrBi5CZi0c",
  authDomain: "inasep-online.firebaseapp.com",
  projectId: "inasep-online",
  storageBucket: "inasep-online.firebasestorage.app",
  messagingSenderId: "57158232904",
  appId: "1:57158232904:web:846c73a7b3121b6431a17d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

/* Segunda instancia para crear usuarios sin desloguear al admin */
const secondaryApp  = firebase.initializeApp(firebaseConfig, 'secondary');
const secondaryAuth = secondaryApp.auth();

/* ════════════════════════════════════════════════
   ESTADO GLOBAL
════════════════════════════════════════════════ */
let currentUser = null;
let currentRole = null;
let _teacherClassTimer  = null;
let _teacherRTListener  = null;
let _attendanceListener = null;
let _heartbeatTimer     = null;  // heartbeat alumno online

/* ════════════════════════════════════════════════
   AUTH
════════════════════════════════════════════════ */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (!doc.exists) {
        await auth.signOut();
        showAuth();
        showAuthAlert('Tu cuenta no está habilitada en este portal. Contacta al administrador.');
        return;
      }
      currentRole = doc.data().role || 'student';
    } catch(e) { currentRole = 'student'; }
    showDashboard();
  } else {
    showAuth();
  }
});

function showAuth() {
  document.getElementById('authSection').classList.remove('hidden');
  document.getElementById('dashboardSection').classList.add('hidden');
}
function showDashboard() {
  document.getElementById('authSection').classList.add('hidden');
  document.getElementById('dashboardSection').classList.remove('hidden');
  updateSidebar();
  // F5: volver a la misma pantalla donde estabas (guardada solo en esta pestaña)
  let _nav = null;
  try { const r = JSON.parse(sessionStorage.getItem('inasep_online_nav') || 'null'); if (r && currentUser && r.uid === currentUser.uid && r.view && true) _nav = r; } catch (e) {}
  renderMain(_nav ? _nav.view : undefined, _nav ? _nav.params : {});
  if (_nav) { const el = document.getElementById('nav-' + String(_nav.view).split('/')[0]); if (el) el.classList.add('active'); }
}

function formatRutInput(input) {
  let v = input.value.replace(/[^0-9kK]/g, '').toUpperCase();
  if (v.length > 1) v = v.slice(0, -1) + '-' + v.slice(-1);
  input.value = v;
}
// Variables de sesión en sala
let _currentClassId        = null;
let _classEntryTime        = null;
let _attendanceDocId       = null;
let _teacherCurrentClassId = null; // separado del alumno

/* ════════════════════════════════════════════════
   WORKER online-proxy — token invisible de Jitsi, asistencia y bloque
   (la asistencia la escribe SOLO el servidor; el navegador ya no la toca)
════════════════════════════════════════════════ */
const WORKER_URL = 'https://online-proxy.inasep.workers.dev';   // ← AJUSTA si tu Worker tiene otra URL
let _lastIdToken = '';
let _jitsiApi = null, _jitsiScript = null, _sesionSalaUnsub = null, _miSesionSala = null;
let _chatListener = null, _claseListener = null;

async function getIdToken() {
  if (!currentUser) throw new Error('No hay usuario autenticado');
  _lastIdToken = await currentUser.getIdToken();
  return _lastIdToken;
}
async function workerFetch(path, options = {}) {
  const idToken = await getIdToken();
  return fetch(WORKER_URL + path, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken, ...(options.headers || {}) } });
}

function cargarJitsiApi(domain) {
  if (window.JitsiMeetExternalAPI) return Promise.resolve();
  if (_jitsiScript) return _jitsiScript;
  _jitsiScript = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = `https://${domain}/external_api.js`;
    sc.onload = res;
    sc.onerror = () => { _jitsiScript = null; rej(new Error('No se pudo cargar Jitsi desde ' + domain)); };
    document.head.appendChild(sc);
  });
  return _jitsiScript;
}

/* Un solo dispositivo por alumno: si entra desde otro aparato, este se desconecta con aviso (el último que entra gana) */
function _detenerVigilanciaSesion() { if (_sesionSalaUnsub) { try { _sesionSalaUnsub(); } catch (e) {} } _sesionSalaUnsub = null; _miSesionSala = null; }
function _vigilarSesionUnica(classId, sesionId) {
  _detenerVigilanciaSesion();
  if (!sesionId || currentRole !== 'student' || !currentUser) return;
  _miSesionSala = sesionId;
  try {
    _sesionSalaUnsub = db.collection('sesionesSala').doc(`${classId}__${currentUser.uid}`).onSnapshot(snap => {
      if (snap.metadata && snap.metadata.fromCache) return;
      const d = snap.exists ? snap.data() : null;
      if (!d || !d.sesionId || d.sesionId === _miSesionSala) return;
      _detenerVigilanciaSesion();
      // El otro dispositivo ya tomó la asistencia: este no debe enviar "salida" ni latidos
      if (_heartbeatTimer) { clearInterval(_heartbeatTimer); _heartbeatTimer = null; }
      _currentClassId = null; _classEntryTime = null;
      if (_jitsiApi) { try { _jitsiApi.dispose(); } catch (e) {} _jitsiApi = null; }
      const host = document.getElementById('jitsiHost');
      if (host) host.innerHTML = `<div class="video-placeholder"><div class="icon">📱</div><p><strong>Tu sesión se abrió en otro dispositivo.</strong><br>Por seguridad solo puedes estar conectado desde un aparato a la vez, así que aquí se cerró.</p><button class="btn btn-primary" style="margin-top:12px" onclick="reingresarSala('${classId}')">Volver a entrar aquí</button></div>`;
      toast('Tu sesión se abrió en otro dispositivo; esta se cerró.', 'warning', 8000);
    }, () => {});
  } catch (e) { /* sin vigilancia: el Worker igual registra al último dispositivo */ }
}

/* Pide el token al Worker (rol, profesor asignado y estado del bloque se validan en el servidor) y abre la sala.
   Alumno: entra con cámara y micrófono apagados, ve al profesor fijado en grande y la cámara solo se habilita cuando el profesor pasa lista.
   Profesor: se ve a sí mismo, con cámara y micrófono listos. */
let _salaState = { local: null, pinned: false, tile: false, teacher: '', timer: null };
const _norm = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function _fijar(id) { try { if (_jitsiApi && id) _jitsiApi.executeCommand('pinParticipant', id); } catch (e) {} }
function _fijarYo() { _fijar(_salaState.local); }
function _buscarDocente() {
  try {
    if (!_salaState.teacher) return;
    const p = (_jitsiApi.getParticipantsInfo() || []).find(x => x.participantId !== _salaState.local && _norm(x.displayName) === _salaState.teacher);
    if (p) { _salaState.pinned = true; _fijar(p.participantId); }
  } catch (e) {}
}
function _contarSala() {
  try { const n = _jitsiApi.getNumberOfParticipants(); const el = document.getElementById('salaCount'); if (el) el.textContent = n; } catch (e) {}
  if (typeof _renderListaDocente === 'function') _renderListaDocente();
}
function _alCambiarVideo(muted) {
  if (currentRole !== 'student' || muted) return;
  if (_listaActiva) _confirmarLista();
  else { try { _jitsiApi.executeCommand('toggleVideo'); } catch (e) {} }   // fuera de la lista la cámara del alumno permanece apagada
}
async function montarVideoJitsi(hostId, classId, opts = {}) {
  const host = document.getElementById(hostId); if (!host) return;
  const msg = (icono, txt) => {
    _detenerVigilanciaSesion();
    if (_jitsiApi) { try { _jitsiApi.dispose(); } catch (e) {} _jitsiApi = null; }
    host.innerHTML = `<div class="video-placeholder"><div class="icon">${icono}</div><p>${escHtml(txt)}</p></div>`;
  };
  try {
    const res = await workerFetch('/api/jitsi/token', { method: 'POST', body: JSON.stringify({ classId }) });
    const j = await res.json().catch(() => ({}));
    if (j.code === 'SIN_SALA_JITSI') return msg('🔒', 'La sala de esta clase no está bien configurada. Un administrador debe editar la clase y guardarla.');
    if (!res.ok) return msg(res.status === 409 ? '⏳' : '🔒', j.error || 'No se pudo abrir la sala.');
    await cargarJitsiApi(j.domain);
    if (!document.getElementById(hostId)) return;
    if (_jitsiApi) { try { _jitsiApi.dispose(); } catch (e) {} _jitsiApi = null; }
    if (_salaState.timer) { clearInterval(_salaState.timer); _salaState.timer = null; }
    host.innerHTML = '';
    _vigilarSesionUnica(classId, j.sesionId);

    const esDocente = !!j.moderator, obs = !!j.observador;
    const cfg = { prejoinConfig: { enabled: false }, disableDeepLinking: true, disableInviteFunctions: true, subject: opts.titulo || 'Clase en vivo' };
    if (obs) {
      Object.assign(cfg, { startWithAudioMuted: true, startWithVideoMuted: true, toolbarButtons: ['fullscreen', 'tileview', 'settings'] });
    } else if (esDocente) {
      Object.assign(cfg, { startWithAudioMuted: false, startWithVideoMuted: false,
        toolbarButtons: ['microphone', 'camera', 'desktop', 'tileview', 'raisehand', 'participants-pane', 'mute-everyone', 'mute-video-everyone', 'select-background', 'fullscreen', 'settings'] });
    } else {
      Object.assign(cfg, { startWithAudioMuted: true, startWithVideoMuted: true, disableShortcuts: true, filmstrip: { disabled: true }, channelLastN: 4,
        toolbarButtons: ['microphone', 'raisehand', 'fullscreen', 'settings'] });
    }
    _salaState = { local: null, pinned: false, tile: false, teacher: _norm(opts.teacherName), timer: null };
    const api = new JitsiMeetExternalAPI(j.domain, {
      roomName: j.room, jwt: j.jwt, parentNode: host, width: '100%', height: '100%',
      userInfo: { displayName: currentUser.displayName || '' }, configOverwrite: cfg
    });
    _jitsiApi = api;
    api.addListener('videoConferenceJoined', (e) => {
      _salaState.local = e.id; _contarSala();
      if (esDocente) setTimeout(_fijarYo, 800); else if (!obs) _buscarDocente();
    });
    api.addListener('participantJoined', (e) => {
      _contarSala();
      if (!esDocente && !obs && !_salaState.pinned && _salaState.teacher && _norm(e.displayName) === _salaState.teacher) { _salaState.pinned = true; _fijar(e.id); }
    });
    api.addListener('participantLeft', _contarSala);
    api.addListener('participantRoleChanged', (e) => {
      if (!esDocente && !obs && !_salaState.pinned && e.role === 'moderator' && e.id !== _salaState.local) { _salaState.pinned = true; _fijar(e.id); }
    });
    api.addListener('tileViewChanged', (e) => { _salaState.tile = !!e.enabled; });
    api.addListener('videoMuteStatusChanged', (e) => _alCambiarVideo(e.muted));
    if (!esDocente && !obs) {

/* Pantalla completa horizontal (celulares): API nativa + bloqueo de orientación; si no hay (iPhone) se rota por CSS */
let _salaPc = { el: null, css: false };
function _salaPcAjustar() { const el = _salaPc.el; if (!el) return; el.classList.toggle('rotada', window.innerHeight > window.innerWidth); }
function _salaPcSalir() {
  const el = _salaPc.el; if (!el) return;
  el.classList.remove('sala-pc', 'rotada');
  const b = el.querySelector('.sala-pc-salir'); if (b) b.remove();
  _salaPc.el = null;
  window.removeEventListener('resize', _salaPcAjustar); window.removeEventListener('orientationchange', _salaPcAjustar);
  document.removeEventListener('fullscreenchange', _salaPcCambioFs); document.removeEventListener('webkitfullscreenchange', _salaPcCambioFs);
  try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) {}
  if (document.fullscreenElement || document.webkitFullscreenElement) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
}
function _salaPcCambioFs() { if (_salaPc.el && !(document.fullscreenElement || document.webkitFullscreenElement) && !_salaPc.css) _salaPcSalir(); }
async function pantallaCompletaSala() {
  if (_salaPc.el) return _salaPcSalir();
  const host = document.getElementById('jitsiHost');
  const el = host && host.closest('.video-room');
  if (!el) { toast('La sala todavía no está lista.', 'warning'); return; }
  _salaPc = { el, css: false };
  const btn = document.createElement('button'); btn.className = 'sala-pc-salir'; btn.type = 'button'; btn.textContent = '✕ Salir de pantalla completa';
  btn.onclick = (ev) => { ev.stopPropagation(); _salaPcSalir(); };
  el.appendChild(btn); el.classList.add('sala-pc');
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) {
    try { await req.call(el); document.addEventListener('fullscreenchange', _salaPcCambioFs); document.addEventListener('webkitfullscreenchange', _salaPcCambioFs); }
    catch (e) { _salaPc.css = true; }
  } else { _salaPc.css = true; }
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
  window.addEventListener('resize', _salaPcAjustar); window.addEventListener('orientationchange', _salaPcAjustar);
  setTimeout(_salaPcAjustar, 350); setTimeout(_salaPcAjustar, 1000);
}

/* Nombre de sala: privado e imposible de adivinar (online-<titulo>-<fecha>-<8 hex al azar>) */
function slugTxt(x) { return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
function generarSala(title, dateStr) {
  const base = slugTxt(title).slice(0, 40) || 'clase';
  const f = String(dateStr || '').slice(0, 10).replace(/-/g, '');
  const rnd = Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2, '0')).join('');
  return `online-${base}-${f}-${rnd}`.slice(0, 90);
}
const SALA_RE = /^online-[a-z0-9][a-z0-9._-]{2,92}$/;
function toLocalInput(ts) {
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ════════════════════════════════════════════════
   LISTA POR CÁMARA
   Los alumnos entran con la cámara apagada. Cuando el profesor "pasa lista", a los alumnos se les pide encender la cámara
   (un clic) y al terminar se apaga sola. Cada confirmación queda como mensaje inmutable en la subcolección chat de la clase
   (las reglas no permiten editar ni borrar) y solo se acepta la orden si la envió un profesor o administrador.
════════════════════════════════════════════════ */
let _listaActiva = null;                  // alumno: { id, confirmado }
let _listaClassId = null, _listaListener = null, _okListener = null, _listaTimer = null, _listaTick = null;
let _listaDocente = null;                 // profesor: { id, desde, cerrada }
let _okNombres = {}, _rolCache = {};
const LISTA_MAX_MS = 3 * 60 * 1000, LISTA_VIGENTE_MS = 4 * 60 * 1000;
const _msDoc = (m) => (m && m.createdAt && m.createdAt.toMillis) ? m.createdAt.toMillis() : Date.now();

function _limpiarLista() {
  if (_listaListener) { _listaListener(); _listaListener = null; }
  if (_okListener) { _okListener(); _okListener = null; }
  if (_listaTimer) { clearTimeout(_listaTimer); _listaTimer = null; }
  if (_listaTick) { clearInterval(_listaTick); _listaTick = null; }
  _listaActiva = null; _listaDocente = null; _okNombres = {}; _listaClassId = null;
}
async function _esDocenteUid(uid) {
  if (!uid) return false;
  if (_rolCache[uid] === undefined) {
    try { const u = await db.collection('users').doc(uid).get(); _rolCache[uid] = u.exists ? u.data().role : ''; } catch (e) { return false; }
  }
  return _rolCache[uid] === 'teacher' || _rolCache[uid] === 'admin';
}
function escucharLista(classId) {
  _limpiarLista();
  if (currentRole === 'fiscalizador') return;
  _listaClassId = classId;
  const col = db.collection('liveClasses').doc(classId).collection('chat');
  _listaListener = col.where('tipo', '==', 'lista').onSnapshot(async snap => {
    const evs = snap.docs.map(d => d.data()).sort((a, b) => _msDoc(a) - _msDoc(b));
    let ev = null;
    for (let i = evs.length - 1; i >= 0; i--) { if (await _esDocenteUid(evs[i].uid)) { ev = evs[i]; break; } }   // una orden falsa de un alumno se ignora
    if (!ev) return;
    const abierta = ev.accion === 'abrir' && (Date.now() - _msDoc(ev)) < LISTA_VIGENTE_MS;
    if (currentRole === 'student') abierta ? _abrirListaAlumno(ev) : _cerrarListaAlumno();
    else _estadoListaDocente(ev, abierta);
  }, () => {});
  if (currentRole !== 'student') {
    _okListener = col.where('tipo', '==', 'lista-ok').onSnapshot(snap => {
      _okNombres = {};
      snap.docs.forEach(d => { const m = d.data(); (_okNombres[m.listaId] = _okNombres[m.listaId] || {})[m.uid] = m.authorName || 'Alumno'; });
      _renderListaDocente();
    }, () => {});
  }
}

/* ── Alumno ── */
function _bannerLista(ok) {
  const b = document.getElementById('listaBanner'); if (!b) return;
  b.innerHTML = ok

    : `<div class="lista-banner"><div class="lb-ic">📸</div><div class="lb-tx"><strong>El profesor está pasando lista</strong><span>Enciende tu cámara para confirmar que estás presente. Se apagará sola al terminar.</span></div><button class="btn btn-success" onclick="encenderCamaraLista()">📷 Encender cámara</button></div>`;
}
function _abrirListaAlumno(ev) {
  if (_listaActiva && _listaActiva.id === ev.listaId) return;
  _listaActiva = { id: ev.listaId, confirmado: false };
  if (_listaTimer) clearTimeout(_listaTimer);
  _listaTimer = setTimeout(_cerrarListaAlumno, Math.max(1000, LISTA_VIGENTE_MS - (Date.now() - _msDoc(ev))));
  _bannerLista(false);
  toast('📸 El profesor está pasando lista: enciende tu cámara.', 'warning', 9000);
}
async function encenderCamaraLista() {

}
function _confirmarLista() {
  if (!_listaActiva || _listaActiva.confirmado || !_listaClassId) return;
  _listaActiva.confirmado = true;
  _bannerLista(true);
  db.collection('liveClasses').doc(_listaClassId).collection('chat').add({

}
function _cerrarListaAlumno() {
  if (_listaTimer) { clearTimeout(_listaTimer); _listaTimer = null; }
  if (!_listaActiva) return;
  _listaActiva = null;
  const b = document.getElementById('listaBanner'); if (b) b.innerHTML = '';

}

/* ── Profesor ── */
function _estadoListaDocente(ev, abierta) {
  if (abierta) {
    if (!_listaDocente || _listaDocente.id !== ev.listaId) _listaDocente = { id: ev.listaId, desde: _msDoc(ev), cerrada: false };
    _listaDocente.cerrada = false;
    if (!_listaTick) _listaTick = setInterval(() => {
      if (!_listaDocente || _listaDocente.cerrada) { clearInterval(_listaTick); _listaTick = null; return; }
      if (Date.now() - _listaDocente.desde >= LISTA_MAX_MS) { toggleLista(); return; }      // se cierra sola a los 3 min
      _renderListaDocente();
    }, 1000);
  } else if (_listaDocente && _listaDocente.id === ev.listaId) {
    _listaDocente.cerrada = true;
  } else if (!_listaDocente) {
    _listaDocente = { id: ev.listaId, desde: _msDoc(ev), cerrada: true };
  }
  _renderListaDocente();
}
function _renderListaDocente() {
  const btn = document.getElementById('btnLista');
  const abierta = !!(_listaDocente && !_listaDocente.cerrada);
  if (btn) { btn.textContent = abierta ? '⏹ Terminar lista' : '📸 Pasar lista (cámaras)'; btn.className = 'btn btn-sm ' + (abierta ? 'btn-danger' : 'btn-primary'); }
  const el = document.getElementById('listaPanel'); if (!el) return;
  if (!_listaDocente) { el.innerHTML = ''; return; }
  const nombres = Object.values(_okNombres[_listaDocente.id] || {});
  let enSala = 0; try { enSala = Math.max(0, _jitsiApi.getNumberOfParticipants() - 1); } catch (e) {}
  const chips = nombres.map(n => `<span class="lista-chip">${escHtml(n)}</span>`).join('');
  if (abierta) {
    const rest = Math.max(0, LISTA_MAX_MS - (Date.now() - _listaDocente.desde)), mm = Math.floor(rest / 60000), ss = String(Math.floor(rest / 1000) % 60).padStart(2, '0');
    el.innerHTML = `<div class="lista-panel"><div class="lp-top"><span>📸</span><strong>Lista en curso</strong><span style="font-family:'DM Mono',monospace">${mm}:${ss}</span><span style="margin-left:auto">${nombres.length} confirmaron${enSala ? ' de ' + enSala + ' en sala' : ''}</span></div>${chips ? '<div style="margin-top:6px">' + chips + '</div>' : '<div style="font-size:12px;color:var(--text-light);margin-top:4px">Esperando confirmaciones… tienes la vista en cuadrícula para verlos.</div>'}</div>`;
  } else {
    const hora = new Date(_listaDocente.desde).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `<div class="lista-panel cerrada"><div class="lp-top"><span>✅</span><strong>Última lista (${hora})</strong><span style="margin-left:auto">${nombres.length} confirmaron</span></div>${chips ? '<div style="margin-top:6px">' + chips + '</div>' : ''}</div>`;
  }
}
async function toggleLista() {
  if (!_listaClassId) return;
  const abierta = !!(_listaDocente && !_listaDocente.cerrada);
  const id = abierta ? _listaDocente.id : Date.now().toString(36);

function rutToEmail(rut) {
  const clean = rut.replace(/-/g,'').replace(/\./g,'').toLowerCase();
  return `rut.${clean}@inasep-lms.cl`;
}
function validarRut(rut) {
  const clean = rut.replace(/\./g,'').replace(/-/g,'');
  if (clean.length < 2) return false;
  const dv = clean.slice(-1).toLowerCase();
  const num = clean.slice(0,-1);
  if (!/^\d+$/.test(num)) return false;
  let suma = 0, mult = 2;
  for (let i = num.length-1; i >= 0; i--) {
    suma += parseInt(num[i]) * mult;
    mult = mult === 7 ? 2 : mult + 1;
  }
  const dvEsp = 11 - (suma % 11);
  const dvCalc = dvEsp===11 ? '0' : dvEsp===10 ? 'k' : String(dvEsp);
  return dv === dvCalc;
}
function rutToPassword(rut) {
  const nums = rut.replace(/[^0-9]/g,'');
  return nums.length >= 6 ? nums.slice(-6) : nums.padEnd(6,'0');
}

  try {

}

let currentView = '';
function navigate(view, params={}) {
  if (currentView === 'teacher-room' && view !== 'teacher-room') {
    if (_teacherClassTimer) { clearInterval(_teacherClassTimer); _teacherClassTimer = null; }
    if (_teacherRTListener) { _teacherRTListener(); _teacherRTListener = null; }
  }
  if ((currentView === 'class-room' || currentView === 'teacher-room') && view !== currentView) stopHeartbeat();
  _detenerVigilanciaSesion();
  _limpiarLista();
  if (_jitsiApi) { try { _jitsiApi.dispose(); } catch (e) {} _jitsiApi = null; }
  if (_claseListener) { _claseListener(); _claseListener = null; }
  if (_chatListener) { _chatListener(); _chatListener = null; }
  if (_attendanceListener) { _attendanceListener(); _attendanceListener = null; }
  currentView = view;
  closeSidebar();
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  const navEl = document.getElementById('nav-' + view.split('/')[0]);
  if (navEl) navEl.classList.add('active');
  renderMain(view, params);
}

function renderMain(view, params={}) {
  if (!view) view = currentRole==='admin' ? 'dashboard' : currentRole==='teacher' ? 'live-classes' : currentRole==='fiscalizador' ? 'fisc-dashboard' : 'my-courses';
  currentView = view;
  try { if (currentUser) sessionStorage.setItem('inasep_online_nav', JSON.stringify({ uid: currentUser.uid, view: view, params: params || {} })); } catch (e) {}
  const mc = document.getElementById('mainContent');
  mc.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div>';

  const views = {
    'dashboard':           renderAdminDashboard,
    'live-classes':        renderLiveClasses,
    'new-class':           renderNewClass,
    'attendance':          renderAttendance,
    'reports':             renderReports,
    'schedule':            renderSchedule,
    'alumnos':             renderAlumnos,
    'profesores':          renderProfesores,
    'teacher-attendance':  renderTeacherAttendance,
    'teacher-reports':     renderTeacherReports,
    'my-courses':          renderMyCourses,
    'my-attendance':       renderMyAttendance,
    'class-room':          renderClassRoom,
    'teacher-room':        renderTeacherRoom,
    'fisc-dashboard':      renderFiscDashboard,
    'fisc-clases':         renderFiscClases,
    'fisc-asistencia':     renderFiscAsistencia,
    'fisc-reportes':       renderFiscReportes,
    'fisc-alumnos':        renderFiscAlumnos,
    'fisc-horario':        renderFiscHorario,
    'config':              renderConfig,
    'archivar-curso':      renderArchivarCurso,
    'cursos-archivados':   renderCursosArchivados,
    'post-class':          renderPostClass,
    'post-class-student':  renderPostClassStudent,
    'schedule-view':       renderScheduleView,
    'libro-clases':        renderLibroClases,
    'fisc-libro':          renderLibroClases,
  };
  const fn = views[view.split('/')[0]];
  if (fn) fn(mc, params);
  else mc.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Vista no encontrada.</p></div>';
}

function toast(msg, type='info', dur=4000) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), dur);
}

   UTILIDADES
════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function pctClass(p) { return p>=80?'good':p>=60?'warning':'danger'; }

        <div id="recentClasses"><div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div></div>

        </div>
        <div id="todayAttendance"><div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div></div>
      </div>`;

    if (recentSnap.empty) { rc.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>No hay clases creadas aún.</p></div>'; }
    else {
      rc.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>Título</th><th>Fecha</th><th>Duración</th><th>Estado</th><th></th></tr></thead>
        <tbody>${recentSnap.docs.map(d=>{
          const c=d.data(); const isLive=c.status==='active';
          return `<tr>
            <td><strong>${escHtml(c.title)}</strong></td>
            <td style="font-size:12px">${fmtDateTime(c.scheduledAt)}</td>
            <td>${c.duration||60} min</td>

          </tr>`;}).join('')}

            <div class="live-class-meta">
              <span>📅 ${fmtDateTime(c.scheduledAt)}</span>
              <span>⏱ ${c.duration||60} min</span>
              ${c.courseName ? `<span>🎓 ${escHtml(c.courseName)}</span>` : ''}
              ${c.teacherName ? `<span>👨‍🏫 ${escHtml(c.teacherName)}</span>` : ''}
            </div>
            ${c.description ? `<p style="font-size:13px;color:var(--text-mid);margin-bottom:12px">${escHtml(c.description)}</p>` : ''}
            <div class="live-class-actions">
              ${isTeacher||isAdmin ? `
                <button class="btn ${isLive?'btn-live':'btn-primary'}" onclick="navigate('teacher-room',{id:'${doc.id}'})">
                  ${isLive?'🔴 Entrar a Clase':'▶️ Iniciar Clase'}
                </button>
                ${isAdmin ? `
                  <button class="btn btn-sm btn-secondary" onclick="editClass('${doc.id}')">✏️ Editar</button>
                  <button class="btn btn-sm btn-${isLive?'warning':'success'}" onclick="toggleClassStatus('${doc.id}','${c.status}')">

              `}
            </div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('classesContainer').innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>${escHtml(e.message)}</p></div>`;
  }
}

async function saveClass(id) {
  const title       = document.getElementById('fc_title').value.trim();
  const courseName  = document.getElementById('fc_courseName').value.trim();
  const description = document.getElementById('fc_desc').value.trim();
  const dateVal     = document.getElementById('fc_date').value;
  const duration    = parseInt(document.getElementById('fc_duration').value) || 60;
  const teacherSel  = document.getElementById('fc_teacher');
  const teacherUid  = teacherSel?.value || '';
  const teacherName = teacherUid ? (teacherSel.selectedOptions[0]?.getAttribute('data-name') || '') : '';

  if (!title || title.length < 3) return toast('⚠️ El título debe tener al menos 3 caracteres.', 'warning');
  if (!dateVal) return toast('⚠️ Selecciona fecha y hora.', 'warning');

  try {
    let prev = {};
    if (id) { const d = await db.collection('liveClasses').doc(id).get(); prev = d.exists ? d.data() : {}; }
    const room = SALA_RE.test(String(prev.jitsiRoom || '')) ? prev.jitsiRoom : generarSala(title, dateVal);
    const data = {
      title, courseName, description,
      scheduledAt: firebase.firestore.Timestamp.fromDate(new Date(dateVal)),
      duration, videoType: 'jitsi', jitsiRoom: room, videoUrl: '',
      teacherUid, teacherName, profesorUid: teacherUid, profesorNombre: teacherName, profesoresUids: teacherUid ? [teacherUid] : [],
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (id) {
      await db.collection('liveClasses').doc(id).update(data);
      toast('✅ Clase actualizada.', 'success');
    } else {
      data.status = 'scheduled';
      data.createdBy = currentUser.uid;
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('liveClasses').add(data);
      toast('✅ Clase creada correctamente.', 'success');
    }
    navigate('live-classes');
  } catch (e) { toast('❌ Error: ' + e.message, 'error'); }
}

async function editClass(id) {
  const doc = await db.collection('liveClasses').doc(id).get();
  if (doc.exists) navigate('new-class',{id,data:{id,...doc.data()}});
}
async function deleteClass(id) {
  if (!confirm('¿Eliminar esta clase y todos sus registros de asistencia?')) return;
  const batch = db.batch();
  const attSnap = await db.collection('attendance').where('classId','==',id).get();
  attSnap.docs.forEach(d=>batch.delete(d.ref));
  batch.delete(db.collection('liveClasses').doc(id));
  await batch.commit();
  toast('🗑️ Clase eliminada.','success');
  navigate('live-classes');
}
async function toggleClassStatus(id, current) {
  const accion = current === 'active' ? 'cerrar' : 'iniciar';
  try {
    const res = await workerFetch('/api/bloque/' + accion, { method: 'POST', body: JSON.stringify({ classId: id }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ('Error del servidor (' + res.status + ')'));
    toast(accion === 'cerrar' ? '✅ Clase finalizada. Los minutos quedaron acotados a la hora oficial de cierre.' : '✅ Clase iniciada: los alumnos ya pueden entrar.', 'success', 6000);
  } catch (e) { toast('❌ ' + e.message, 'error', 8000); return; }
  navigate('live-classes');
}

/* ════════════════════════════════════════════════
   VISTA: SALA DEL ALUMNO (class-room)

async function renderClassRoom(mc, params={}) {

  else if (!activa) videoEmbed = `<div class="video-placeholder"><div class="icon">⏳</div><p>La clase aún no ha comenzado.</p><p style="font-size:13px;opacity:0.6;margin-top:8px">Entrarás a la sala automáticamente cuando el profesor la inicie. No necesitas recargar la página.</p></div>`;

        <div class="check-text">
          <strong id="attTitle">${isPresent ? '✅ Asistencia registrada automáticamente' : activa ? 'Registrando asistencia...' : 'Clase no activa'}</strong>
          <span id="attDesc" style="${isPresent?'color:var(--success)':''}">${isPresent ? 'Tu asistencia quedó registrada en el servidor al ingresar a la sala.' : activa ? 'Se registra automáticamente al entrar a la sala.' : 'La asistencia se registra cuando el profesor inicia la clase y tú entras a la sala.'}</span>

async function iniciarClase(classId) {
  const btn = document.getElementById('btnIniciarClase');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Iniciando...'; }
  try {
    const res = await workerFetch('/api/bloque/iniciar', { method: 'POST', body: JSON.stringify({ classId }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ('Error del servidor (' + res.status + ')'));
    toast('✅ Clase iniciada. Tu asistencia quedó registrada.', 'success', 4000);
    navigate('teacher-room', { id: classId });
  } catch (e) {
    toast('❌ ' + e.message, 'error', 8000);
    if (btn) { btn.disabled = false; btn.textContent = '▶️ Iniciar Clase'; }
  }
}
async function cerrarClaseDocente(classId) {
  if (!confirm('¿Finalizar la clase para todos?\n\nLos alumnos serán notificados y los minutos de asistencia quedarán acotados a esta hora oficial de cierre.\nSi solo necesitas salir un momento, usa "Salir de la Sala": la clase sigue abierta.')) return;
  try {
    const res = await workerFetch('/api/bloque/cerrar', { method: 'POST', body: JSON.stringify({ classId }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ('Error del servidor (' + res.status + ')'));
    toast(`⏹ Clase finalizada (${j.tramosCerrados || 0} conexión(es) cerrada(s)).`, 'success', 6000);
    await salirDeSala(classId);
  } catch (e) { toast('❌ ' + e.message, 'error', 8000); }
}

function recargarAlumnosRT(classId) {
  if (_teacherRTListener) { _teacherRTListener(); _teacherRTListener = null; }
  _usersRTCache = {}; // forzar re-lectura al recargar manualmente
  cargarAlumnosRT(classId);
}

function cargarAlumnosRT(classId) {
  const cont = document.getElementById('teacherAlumnosRT');
  if (!cont) return;
  if (_teacherRTListener) _teacherRTListener();

  // Limpiar caché al iniciar una nueva sala
  _usersRTCache = {};

  _teacherRTListener = db.collection('attendance')
    .where('classId','==',classId)
    .where('date','==',todayStr())
    .onSnapshot(async snap => {
      const cont2 = document.getElementById('teacherAlumnosRT');
      if (!cont2) { if(_teacherRTListener){_teacherRTListener();_teacherRTListener=null;} return; }
      if (snap.empty) {
        cont2.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>Aún no hay asistencias registradas hoy.</p></div>'; return;
      }

      // Separar alumnos y profesores
      const allDocs = snap.docs.map(d=>({id:d.id,...d.data()}));
      const teacherDocs = allDocs.filter(a=>(a.userRole==='teacher'||a.userRole==='admin'));
      const studentDocs = allDocs.filter(a=>(a.userRole!=='teacher'&&a.userRole!=='admin'));

      // Solo leer de Firestore los usuarios que no están en caché todavía
      const userIds = [...new Set(allDocs.map(a=>a.userId))];
      const newUids = userIds.filter(uid => !_usersRTCache[uid]);
      if (newUids.length > 0) {
        await Promise.all(newUids.map(async uid => {
          try {
            const u = await db.collection('users').doc(uid).get();
            if (u.exists) _usersRTCache[uid] = u.data();
          } catch(e) {}
        }));
      }
      const usersData = _usersRTCache;

      const now = Date.now();
      const isOnline = (a) => {
        const ud = usersData[a.userId]||{};
        const ls = ud.lastSeen?.toDate?.();
        return ls && (now - ls.getTime()) < 420000 && ud.lastClassId === classId; // 7 min umbral (heartbeat cada 5 min)
      };

      const rowHtml = (a) => {
        const online = isOnline(a);
        const isTeacherRow = (a.userRole==='teacher'||a.userRole==='admin');
        return `<tr style="${isTeacherRow?'background:#f0f8f2;':''}">
          <td><div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:50%;background:${isTeacherRow?'var(--warning)':'var(--green-500)'};color:#fff;font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center">${(a.userName||'?').slice(0,2).toUpperCase()}</div>
            <div>
              <strong>${escHtml(a.userName||'—')}</strong>
              ${isTeacherRow?'<span class="badge badge-orange" style="margin-left:6px;font-size:10px">Profesor</span>':''}
              ${a.autoChecked?'<span style="font-size:10px;color:var(--text-light);margin-left:4px">auto</span>':''}
            </div>
          </div></td>
          <td><span style="font-family:'DM Mono';font-size:12px">${escHtml(a.userRut||'—')}</span></td>
          <td><span class="badge badge-green">✅ Presente</span></td>
          <td style="font-size:12px">${fmtDateTime(a.checkedAt)}</td>
          <td><span class="${online?'online-dot':'offline-dot'}"></span>${online?'<span style="color:var(--success);font-size:12px;font-weight:600">🟢 Online</span>':'<span style="color:#c0392b;font-size:12px;font-weight:600">🔴 Offline</span>'}</td>
        </tr>`;
      };

      cont2.innerHTML = `
        <div style="margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <span class="badge badge-orange">👨‍🏫 Profesores: ${teacherDocs.filter(a=>a.present).length}</span>
          <span class="badge badge-green">🎓 Alumnos presentes: ${studentDocs.filter(a=>a.present).length}</span>
          <span class="badge badge-blue">🟢 Online ahora: ${allDocs.filter(a=>isOnline(a)).length}</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Participante</th><th>RUT</th><th>Estado</th><th>Hora de Registro</th><th>Online</th></tr></thead>
          <tbody>
            ${[...teacherDocs, ...studentDocs].map(rowHtml).join('')}
          </tbody></table></div>`;
    }, err=>{
      const c=document.getElementById('teacherAlumnosRT');
      if(c) c.innerHTML=`<p style="color:var(--danger);padding:12px">${err.message}</p>`;
    });
}

async function salirDeSala(classId) {
  if (_teacherClassTimer) { clearInterval(_teacherClassTimer); _teacherClassTimer = null; }
  if (_teacherRTListener) { _teacherRTListener(); _teacherRTListener = null; }
  _usersRTCache = {};
  const cid = classId || _teacherCurrentClassId || _currentClassId;
  await stopHeartbeat();   // el servidor calcula los minutos de permanencia
  if (_teacherSessionDocId && _teacherClassStart) {
    try {
      const durSeg = Math.floor((new Date() - _teacherClassStart) / 1000);
      await db.collection('teacherSessions').doc(_teacherSessionDocId).update({ salidaAt: firebase.firestore.FieldValue.serverTimestamp(), duracionSeg: durSeg });
    } catch (e) {}
    _teacherSessionDocId = null; _teacherClassStart = null;
  }
  _teacherCurrentClassId = null;
  if (cid && (currentRole === 'teacher' || currentRole === 'admin')) navigate('post-class', { id: cid });
  else navigate('live-classes');
}

    const sortedDocs = snap.docs.sort((a,b)=>(b.data().date||'').localeCompare(a.data().date||''));

    snap.docs.forEach(d => {

async function cargarTablaAsistencia() {
  const cont = document.getElementById('attTableContainer');
  if (!cont) return;
  cont.innerHTML='<div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div>';

  const classId  = document.getElementById('attFilterClass')?.value||'';
  const date     = document.getElementById('attFilterDate')?.value||todayStr();

  try {
    // Obtener todos los alumnos
    const alumnosSnap = await db.collection('users').where('role','==','student').get();
    const alumnosDocs = alumnosSnap.docs.sort((a,b)=>(a.data().name||'').localeCompare(b.data().name||'','es'));

    // Obtener asistencia del día
    let attQuery = db.collection('attendance').where('date','==',date);
    if (classId) attQuery = attQuery.where('classId','==',classId);
    const attSnap = await attQuery.get();

    // Mapa userId → asistencia
    const attMap = {};
    attSnap.docs.forEach(d => {
      const a=d.data();
      const key = classId ? a.userId : `${a.userId}__${a.classId}`;
      attMap[key] = a;
    });

    if (alumnosDocs.length === 0) {
      cont.innerHTML='<div class="empty-state"><div class="icon">📭</div><p>No hay alumnos registrados.</p></div>'; return;
    }

    // Registros que no pertenecen a un alumno activo: profesores, administradores o alumnos eliminados
    const _ids = new Set(alumnosDocs.map(d => d.data().uid || d.id));
    const _otros = attSnap.docs.map(d => d.data()).filter(a => !_ids.has(a.userId));
    const extrasHtml = _otros.length ? `
      <div class="card" style="margin-top:16px">
        <div class="card-header"><h3>👤 Otros registros del día</h3><span class="badge badge-gray">${_otros.length}</span></div>
        <div style="padding:0 18px 6px;font-size:12px;color:var(--text-light)">Profesores, administradores o alumnos que ya no están en la lista.</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Nombre</th><th>Rol</th><th>Clase</th><th>Entrada</th><th>Salida</th><th>Minutos</th></tr></thead>
          <tbody>${_otros.map(a => `<tr>
            <td><strong>${escHtml(a.userName || '—')}</strong></td>
            <td>${escHtml(a.userRole === 'teacher' ? 'Profesor' : a.userRole === 'admin' ? 'Administrador' : a.userRole === 'student' ? 'Alumno (eliminado)' : (a.userRole || '—'))}</td>
            <td style="font-size:12px">${escHtml(a.classTitle || '—')}</td>
            <td style="font-size:12px;font-family:'DM Mono'">${a.checkedAt ? fmtTime(a.checkedAt) : '—'}</td>
            <td style="font-size:12px;font-family:'DM Mono'">${a.salidaAt ? fmtTime(a.salidaAt) : '—'}</td>
            <td style="font-size:12px;text-align:center">${a.minutosEnClase ? a.minutosEnClase + ' min' : '—'}</td>
          </tr>`).join('')}</tbody></table></div>
      </div>` : '';

    const dateFormatted = new Date(date+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    cont.innerHTML = `
      <div class="card">
        <div class="card-header">
          <h3>📋 Asistencia — ${escHtml(dateFormatted)}</h3>
          <span class="badge badge-blue">${attSnap.docs.filter(d=>d.data().present).length} presentes</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Alumno</th><th>RUT</th><th>Estado</th><th>Entrada</th><th>Salida</th><th>Minutos</th><th>Online</th></tr></thead>
          <tbody>${alumnosDocs.map(d=>{
            const u=d.data();
            const att = classId ? attMap[u.uid||d.id] : Object.values(attMap).find(a=>a.userId===(u.uid||d.id));
            const present = att?.present===true;
            const online  = att?.online && att?.checkedAt && (new Date()-att.checkedAt.toDate?.()||0)<600000;
            return `<tr>
              <td><div style="display:flex;align-items:center;gap:8px">
                <div style="width:28px;height:28px;border-radius:50%;background:${present?'var(--success)':'#ccc'};color:#fff;font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center">${(u.name||'?').slice(0,2).toUpperCase()}</div>
                <strong>${escHtml(u.name||'—')}</strong>
              </div></td>
              <td><span style="font-family:'DM Mono';font-size:12px">${escHtml(u.rut||'—')}</span></td>
              <td><span class="badge ${present?'badge-green':'badge-gray'}">${present?'✅ Presente':'— Ausente'}</span></td>
              <td style="font-size:12px;font-family:'DM Mono'">${att?.checkedAt ? fmtTime(att.checkedAt) : '—'}</td>
              <td style="font-size:12px;font-family:'DM Mono'">${att?.salidaAt ? fmtTime(att.salidaAt) : '—'}</td>
              <td style="font-size:12px;text-align:center">${att?.minutosEnClase ? att.minutosEnClase+' min' : '—'}</td>
              <td><span class="${online?'online-dot':'offline-dot'}"></span>${online?'<span style="color:var(--success);font-size:12px;font-weight:600">🟢 Online</span>':'<span style="color:#c0392b;font-size:12px;font-weight:600">🔴 Offline</span>'}</td>
            </tr>`;
          }).join('')}</tbody></table></div>
      </div>${extrasHtml}`;
  } catch(e) {
    cont.innerHTML=`<div class="empty-state"><div class="icon">❌</div><p>${escHtml(e.message)}</p></div>`;
  }
}

async function previewReport() {
  const type    = document.getElementById('rpt_type').value;
  const classId = document.getElementById('rpt_class').value;
  const from    = document.getElementById('rpt_date_from').value;
  const to      = document.getElementById('rpt_date_to').value;

  const previewDiv = document.getElementById('reportPreview');
  const previewCont = document.getElementById('reportPreviewContent');
  previewCont.innerHTML='<div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div>';
  previewDiv.style.display='block';

  try {
    // Obtener alumnos
    const alumnosSnap = await db.collection('users').where('role','==','student').get();
    const alumnos = alumnosSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','es'));

    // Obtener clases
    let clsQuery = db.collection('liveClasses');
    if (classId) clsQuery = db.collection('liveClasses').where(firebase.firestore.FieldPath.documentId(),'==',classId);
    const clsSnap  = await (classId ? db.collection('liveClasses').doc(classId).get() : db.collection('liveClasses').get());
    const clases   = classId ? (clsSnap.exists ? [{id:classId,...clsSnap.data()}] : []) : clsSnap.docs.map(d=>({id:d.id,...d.data()}));

    // Obtener asistencias en rango
    let attQuery = db.collection('attendance').where('date','>=',from).where('date','<=',to);
    if (classId) attQuery = attQuery.where('classId','==',classId);
    const attSnap  = await attQuery.get();
    const attDocs  = attSnap.docs.map(d=>({id:d.id,...d.data()}));

    // Obtener fechas únicas
    const allDates = [...new Set(attDocs.map(a=>a.date))].sort();

    // PERF FIX: índice O(1) para evitar .find() O(n) dentro de doble bucle alumnos×fechas
    const attIndex = {};
    attDocs.forEach(a => { attIndex[a.userId+"|"+a.date+(a.classId?"|"+a.classId:"")] = a; });

    // Tiempo total del curso por alumno (toda la colección, sin filtro de fechas)
    let courseTimeQuery = db.collection('attendance').where('present','==',true);
    if (classId) courseTimeQuery = courseTimeQuery.where('classId','==',classId);
    const courseTimeSnap = await courseTimeQuery.get();
    const minPorAlumno = {};
    courseTimeSnap.docs.forEach(d=>{
      const a=d.data();
      if (!minPorAlumno[a.userId]) minPorAlumno[a.userId]=0;
      minPorAlumno[a.userId]+=(a.minutosEnClase||0);
    });

    if (type==='clase_dia' || type==='resumen_clase') {
      // Tabla: filas = alumnos, columnas = fechas
      _reportTitle = `Asistencia${classId?' — '+clases[0]?.title:' — Todas las Clases'} (${from} al ${to})`;
      const rows = alumnos.map(al => {
        const diasPresente = allDates.map(d => {
          const att = attIndex[al.id+"|"+d+(classId?"|"+classId:"")] || attIndex[al.id+"|"+d] || null; // O(1) index
          return att?.present===true;
        });
        const total         = diasPresente.filter(Boolean).length;
        const pct           = allDates.length>0 ? Math.round((total/allDates.length)*100) : 0;
        const totalMinCurso = minPorAlumno[al.id]||0;
        return { nombre:al.name||'—', rut:al.rut||'—', dias:diasPresente, total, pct, totalMinCurso };
      });
      _reportData = { type:'tabla_diaria', title:_reportTitle, dates:allDates, rows, classTitle:clases[0]?.title||'Todas' };

      previewCont.innerHTML = rows.length===0
        ? '<div class="empty-state"><div class="icon">📭</div><p>Sin datos.</p></div>'
        : `<div class="att-table-wrap"><table class="att-table">
          <thead>
            <tr>
              <th>Alumno</th><th>RUT</th>
              ${allDates.map(d=>`<th style="white-space:nowrap">${d.slice(5)}</th>`).join('')}
              <th>Total</th><th>%</th><th style="text-align:center">Horas Curso</th>
            </tr>
          </thead>
          <tbody>${rows.map(r=>{
            const hc=Math.floor((r.totalMinCurso||0)/60);
            const mc2=(r.totalMinCurso||0)%60;
            const hStr=r.totalMinCurso?(hc>0?hc+'h '+mc2+'min':mc2+' min'):'—';
            return `<tr>
              <td><strong>${escHtml(r.nombre)}</strong></td>
              <td><span style="font-family:'DM Mono';font-size:11px">${escHtml(r.rut)}</span></td>
              ${r.dias.map(p=>`<td class="text-center"><span class="${p?'att-dot-ok':'att-dot-no'}">${p?'✓':''}</span></td>`).join('')}
              <td class="text-center"><strong>${r.total}</strong></td>
              <td class="text-center"><span class="att-pct ${pctClass(r.pct)}">${r.pct}%</span></td>

async function exportTeacherReport() {
  const from = document.getElementById('trpt_from').value;
  const to   = document.getElementById('trpt_to').value;

  try {
    toast('⏳ Generando reporte...','info',3000);
    const clsSnap = await db.collection('liveClasses').where('teacherUid','==',currentUser.uid).get();
    const myIds   = clsSnap.docs.map(d=>d.id);
    if (!myIds.length) return toast('⚠️ No tienes clases asignadas.','warning');

    const attSnap = await db.collection('attendance')
      .where('classId','in',myIds.slice(0,10))
      .where('date','>=',from).where('date','<=',to).get();
    const attDocs = attSnap.docs.map(d=>({id:d.id,...d.data()}));

    const dates = [...new Set(attDocs.map(a=>a.date))].sort();
    const alumnosIds = [...new Set(attDocs.map(a=>a.userId))];
    const alumnosSnap = await db.collection('users').where('role','==','student').get();
    const alumnos = alumnosSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','es'));

    // Tiempo total por alumno (sin filtro de fecha para acumulado del curso)
    let tQuery = db.collection('attendance').where('classId','in',myIds.slice(0,10)).where('present','==',true);
    const tSnap = await tQuery.get();
    const minPorAlumno = {};
    tSnap.docs.forEach(d=>{ const a=d.data(); minPorAlumno[a.userId]=(minPorAlumno[a.userId]||0)+(a.minutosEnClase||0); });

    // Índice O(1) para lookup por alumno+fecha
    const attIdx = {};
    attDocs.forEach(a=>{ attIdx[a.userId+"|"+a.date]=a; });

    const wb = XLSX.utils.book_new();
    const header = ['Alumno','RUT',...dates,'Días Presentes','% Asistencia','Min. Totales Curso','Horas Curso'];
    const rows = alumnos.map(al => {
      const dias = dates.map(d => {
        const att = attIdx[al.id+"|"+d];
        return att?.present ? 'Presente' : 'Ausente';
      });
      const total  = dias.filter(d=>d==='Presente').length;
      const pct    = dates.length>0 ? Math.round((total/dates.length)*100) : 0;
      const totMin = minPorAlumno[al.id]||0;
      const hStr   = totMin?(Math.floor(totMin/60)+'h '+(totMin%60)+'min'):'—';
      return [al.name||'—',al.rut||'—',...dias,total,pct+'%',totMin,hStr];
    });
    const ws = XLSX.utils.aoa_to_sheet([header,...rows]);
    ws['!cols'] = [{wch:30},{wch:14},...dates.map(()=>({wch:12})),{wch:14},{wch:10},{wch:16},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, 'Asistencia');

    const filename = `Asistencia_MisClases_${todayStr()}.xlsx`;
    XLSX.writeFile(wb, filename);
    toast('📥 Reporte exportado.','success');
  } catch(e) {
    toast('❌ Error: '+e.message,'error');
  }
}

function renderScheduleTable(entries) {

  });

  return Object.keys(byDay).map(day => `

      <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--green-100)">
        📅 ${escHtml(day)}

        <div class="schedule-row">

          <div>

function handleSchedDrop(e) {
  e.preventDefault();
  document.getElementById('schedDropZone').classList.remove('dragging');

  if (file) readScheduleFile({files:[file]});
}

async function readScheduleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const prev = document.getElementById('schedPreview');
  prev.innerHTML='<p style="font-size:13px;color:var(--text-mid)">⏳ Leyendo archivo...</p>';

  try {
    const data = await file.arrayBuffer();
    const wb   = XLSX.read(data, {type:'array'});
    const ws   = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});

    if (!rows.length) { prev.innerHTML='<p style="color:var(--danger)">❌ El archivo está vacío.</p>'; return; }

    // Mapear columnas flexiblemente
    const dayMap    = {dia:'day',día:'day',day:'day'};
    const startMap  = {'hora inicio':'timeStart','hora_inicio':'timeStart','start':'timeStart','inicio':'timeStart','hora inicio':'timeStart'};
    const endMap    = {'hora fin':'timeEnd','hora_fin':'timeEnd','end':'timeEnd','fin':'timeEnd','término':'timeEnd','termino':'timeEnd'};
    const subjMap   = {materia:'subject',asignatura:'subject',módulo:'subject',modulo:'subject',clase:'subject',subject:'subject',tema:'subject'};
    const profMap   = {profesor:'teacher',docente:'teacher',teacher:'teacher'};

    function findKey(obj, mapObj) {
      const keys = Object.keys(obj).map(k=>k.toLowerCase().trim());
      for (const [k,v] of Object.entries(mapObj)) {
        const idx = keys.findIndex(kk=>kk.includes(k));
        if (idx>=0) return Object.keys(obj)[idx];
      }
      return null;
    }

    const first = rows[0];
    const dayKey  = findKey(first,dayMap);
    const sKey    = findKey(first,startMap);
    const eKey    = findKey(first,endMap);
    const subKey  = findKey(first,subjMap);
    const profKey = findKey(first,profMap);

    if (!dayKey||!subKey) {
      prev.innerHTML='<p style="color:var(--danger)">❌ No se encontraron las columnas requeridas (Día, Materia). Revisa el formato.</p>'; return;
    }

    const dayOrder = {lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6,domingo:7};
    const parsed = rows.filter(r=>r[subKey]).map(r=>({
      day:        String(r[dayKey]||'').trim(),
      dayOrder:   dayOrder[(String(r[dayKey]||'').toLowerCase().trim())]||9,
      timeStart:  String(r[sKey]||'').trim(),
      timeEnd:    String(r[eKey]||'').trim(),
      subject:    String(r[subKey]||'').trim(),
      teacher:    profKey ? String(r[profKey]||'').trim() : '',
    }));

    prev.innerHTML = `
      <div style="background:#eafaf1;padding:12px 14px;border-radius:8px;margin-bottom:10px;font-size:13px">
        ✅ <strong>${parsed.length} entradas</strong> listas para importar
      </div>
      <div class="table-wrap" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
        <table><thead><tr><th>Día</th><th>Inicio</th><th>Fin</th><th>Materia</th><th>Profesor</th></tr></thead>
        <tbody>${parsed.slice(0,20).map(e=>`<tr>
          <td>${escHtml(e.day)}</td><td>${escHtml(e.timeStart)}</td><td>${escHtml(e.timeEnd)}</td>
          <td>${escHtml(e.subject)}</td><td>${escHtml(e.teacher)}</td>
        </tr>`).join('')}${parsed.length>20?`<tr><td colspan="5" class="text-center" style="color:var(--text-light);font-size:12px">... y ${parsed.length-20} más</td></tr>`:''}</tbody></table>
      </div>
      <div style="margin-top:12px">
        <button class="btn btn-primary" onclick="importarHorario(window._schedParsed)">✅ Importar Horario</button>
        <button class="btn btn-secondary" style="margin-left:8px" onclick="document.getElementById('schedPreview').innerHTML=''">✖ Cancelar</button>
      </div>`;
    window._schedParsed = parsed;
  } catch(e) {
    document.getElementById('schedPreview').innerHTML=`<p style="color:var(--danger)">❌ Error al leer el archivo: ${escHtml(e.message)}</p>`;
  }
}

async function importarHorario(entries) {
  if (!entries||!entries.length) return;
  const btn = document.querySelector('button[onclick*="importarHorario"]');
  if (btn) { btn.disabled=true; btn.textContent='⏳ Importando...'; }

  try {
    // Borrar horario existente
    const existing = await db.collection('scheduleEntries').get();
    const batch1 = db.batch();
    existing.docs.forEach(d=>batch1.delete(d.ref));
    await batch1.commit();

    // Insertar nuevo horario por lotes de 500
    for (let i=0; i<entries.length; i+=400) {
      const batch2 = db.batch();
      entries.slice(i,i+400).forEach(e => {
        const ref = db.collection('scheduleEntries').doc();
        batch2.set(ref,{...e, createdAt:firebase.firestore.FieldValue.serverTimestamp(), createdBy:currentUser.uid});
      });
      await batch2.commit();
    }
    toast(`✅ Horario importado: ${entries.length} entradas.`,'success');
    navigate('schedule');
  } catch(e) {
    toast('❌ Error al importar: '+e.message,'error');
    if (btn) { btn.disabled=false; btn.textContent='✅ Importar Horario'; }
  }
}

async function borrarHorario() {
  if (!confirm('¿Eliminar todo el horario actual?')) return;
  try {
    const snap = await db.collection('scheduleEntries').get();
    const batch = db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    toast('🗑️ Horario borrado.','success');
    navigate('schedule');
  } catch(e) { toast('❌ Error: '+e.message,'error'); }
}

function parseBulkLine(line) {
  const parts = line.trim().split(/\t|;|  +/);
  if (parts.length < 2) return null;
  let nombre='',rut='';
  for (let i=0;i<parts.length;i++) {
    const p = parts[i].trim();
    if (/^\d{6,8}-?[\dkK]$/.test(p.replace(/\./g,''))) {
      rut = p.replace(/\./g,'');
      nombre = parts.filter((_,j)=>j!==i).join(' ').trim();
      break;
    }
  }
  if (!nombre||!rut) { nombre=parts[0].trim(); rut=parts[1].trim().replace(/\./g,''); }
  if (!rut.includes('-')&&rut.length>1) rut=rut.slice(0,-1)+'-'+rut.slice(-1);
  return {nombre,rut};
}

let _bulkAlumnos = [];

function previewBulk() {
  const text = document.getElementById('bulkTable').value.trim();
  if (!text) return toast('⚠️ Pega los datos primero.','warning');
  const lines = text.split('\n').filter(l=>l.trim());
  _bulkAlumnos=[]; const errors=[];
  lines.forEach((line,i) => {
    const p = parseBulkLine(line);
    if (!p) { errors.push(`Línea ${i+1}: no interpretada`); return; }
    if (!validarRut(p.rut)) { errors.push(`Línea ${i+1}: RUT inválido (${p.rut})`); return; }
    _bulkAlumnos.push(p);
  });
  const preview = document.getElementById('bulkPreview');
  const btn     = document.getElementById('btnBulkCreate');
  if (!_bulkAlumnos.length) {
